# rift client configuration.
# Load with:  rift client --config ~/.config/rift/client.toml
# Or set:     RIFT_CONFIG=~/.config/rift/client.toml

[client]
server         = "tunnel.example.com"
token          = ""                    # leave empty to use the saved token DB
db             = "~/.local/share/rift"
insecure       = false
force-insecure = false
stream-timeout = "5m"
protocol       = "rift"                # "rift" or "mcp"

# Tunnels declared here are equivalent to repeated --expose flags.
# Both sources are additive; flag-supplied tunnels are appended to file ones.
[[tunnels]]
local-port = 3000
proto      = "http"
name       = "myapp"

[[tunnels]]
local-port = 5432
proto      = "tcp"

[[tunnels]]
local-port = 9090
proto      = "mcp"
name       = "tools"

# WebTransport tunnel — bidi + uni-streams + datagrams. Bidi/uni streams
# splice onto local-port (TCP); WT datagrams forward to datagram-local-port
# (UDP). Reachable by browsers via
# `new WebTransport("https://game.tunnel.example.com/")`.
# Empty allowed-origins rejects every cross-origin request; "*" matches any.
[[tunnels]]
local-port            = 4000
datagram-local-port   = 9090
proto                 = "wt"
name                  = "game"
allowed-origins       = ["https://app.example.com"]
allowed-wt-protocols  = ["rift.demo.v1"]
